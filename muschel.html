<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Magische Miesmuschel Modus fur ABI Randomizer."
    />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Magische Miesmuschel</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body class="theme-muschel">
    <main class="page-shell muschel-shell">
      <header class="header-container">
        <h1>Magische Miesmuschel</h1>
        <p class="subtitle">Stelle deine Frage und akzeptiere das Urteil.</p>
      </header>

      <section class="muschel-panel" aria-label="Miesmuschel Entscheidung">
        <label class="muschel-input-label" for="muschelQuestionInput"
          >Frage</label
        >
        <textarea
          class="muschel-question-input"
          id="muschelQuestionInput"
          rows="3"
          placeholder="Darf ich dieses Gear spielen?"
        ></textarea>

        <div class="muschel-actions">
          <button class="muschel-ask-btn" id="muschelAskBtn" type="button">
            Miesmuschel befragen
          </button>
          <button class="muschel-clear-btn" id="muschelClearBtn" type="button">
            Verlauf loschen
          </button>
        </div>

        <div class="muschel-result-card" id="muschelResultCard" hidden>
          <p class="muschel-result-title" id="muschelResultTitle"></p>
          <p class="muschel-result-line" id="muschelResultLine"></p>
        </div>

        <section class="muschel-history" aria-label="Verlauf">
          <h2 class="muschel-history-title">Letzte Entscheidungen</h2>
          <ul class="muschel-history-list" id="muschelHistoryList">
            <li class="muschel-history-empty">Noch keine Entscheidung</li>
          </ul>
        </section>
      </section>

      <section
        class="squad-panel"
        aria-label="Squad Modus"
        id="muschel-squadPanel"
      >
        <div class="squad-header">
          <h2 class="squad-title">👥 Squad Modus</h2>
          <button
            class="squad-toggle-btn"
            id="muschel-squadToggle"
            type="button"
            aria-expanded="false"
          >
            <span>Beitreten / Erstellen</span>
            <span id="muschel-squadChevron" aria-hidden="true">▼</span>
          </button>
        </div>
        <div class="squad-content" id="muschel-squadContent">
          <div class="squad-setup" id="muschel-squadSetup">
            <div class="squad-name-row">
              <label class="squad-field-label" for="muschel-squadName"
                >Dein Name</label
              >
              <input
                class="squad-input"
                type="text"
                id="muschel-squadName"
                maxlength="20"
                placeholder="z.B. ILoveThatSkinBro69"
              />
            </div>
            <div class="squad-actions">
              <button
                class="squad-btn squad-btn--create"
                id="muschel-squadCreateBtn"
                type="button"
              >
                Neue Session
              </button>
              <div class="squad-join-row">
                <input
                  class="squad-input squad-code-input"
                  type="text"
                  id="muschel-squadJoinCode"
                  maxlength="2"
                  placeholder="Code eingeben"
                />
                <button
                  class="squad-btn squad-btn--join"
                  id="muschel-squadJoinBtn"
                  type="button"
                >
                  Beitreten
                </button>
              </div>
            </div>
            <p class="squad-error" id="muschel-squadError" hidden></p>
          </div>

          <div class="squad-session" id="muschel-squadSession" hidden>
            <div class="squad-session-header">
              <div class="squad-code-display">
                <span class="squad-code-label">Session Code:</span>
                <strong
                  class="squad-code-value"
                  id="muschel-squadCodeDisplay"
                ></strong>
                <button
                  class="squad-copy-btn"
                  id="muschel-squadCopyBtn"
                  type="button"
                  title="Code kopieren"
                >
                  📋
                </button>
              </div>
              <button
                class="squad-btn squad-btn--leave"
                id="muschel-squadLeaveBtn"
                type="button"
              >
                Verlassen
              </button>
            </div>
            <p
              class="squad-connection-banner"
              id="muschel-squadConnectionBanner"
              hidden
            >
              Verbindung wird wiederhergestellt...
            </p>
            <p class="squad-role-hint" id="muschel-squadRoleHint"></p>
            <p
              class="squad-connection-state offline"
              id="muschel-squadConnectionState"
            >
              Nicht verbunden
            </p>
            <div class="squad-members" id="muschel-squadMembers"></div>
            <div class="squad-feed">
              <h3 class="squad-feed-title">Live Activity</h3>
              <ul class="squad-feed-list" id="muschel-squadActivityFeed">
                <li class="squad-feed-empty">Noch keine Aktivitat</li>
              </ul>
            </div>
          </div>
        </div>
      </section>
    </main>

    <a
      class="mode-link-btn"
      href="./index.html"
      title="Zur Landingpage wechseln"
      aria-label="Zur Landingpage"
      >Zur Landing</a
    >
    <a
      class="mode-link-btn muschel-mode-link-secondary"
      href="./randomizer.html"
      title="Zum Randomizer wechseln"
      aria-label="Zum Randomizer"
      >Zum Randomizer</a
    >

    <section class="master-volume" aria-label="Globale Lautstarke">
      <label class="master-volume-label" for="masterVolumeSlider"
        >Lautstarke</label
      >
      <input
        class="master-volume-slider"
        id="muschel-masterVolumeSlider"
        type="range"
        min="0"
        max="100"
        value="60"
      />
      <span class="master-volume-value" id="muschel-masterVolumeValue"
        >60%</span
      >
    </section>

    <script type="module" src="./assets/js/muschel/app.js"></script>
  </body>
</html>
