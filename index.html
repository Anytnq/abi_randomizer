<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Static ABI Randomizer ready for GitHub Pages deployment."
    />
    <meta name="theme-color" content="#0d0d0d" />
    <title>ABI Randomizer - Arena Breakout Infinite Generator</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="header-container">
        <h1 id="mainTitle">HL Idioten</h1>
        <p class="subtitle" id="subTitle">OPERATION: RNG</p>
      </header>

      <section class="filters-container" aria-label="Advanced filters">
        <button
          class="filter-toggle-btn"
          id="filterToggle"
          type="button"
          aria-expanded="false"
          aria-controls="filterContent"
        >
          <span>Advanced Filters</span>
          <span id="filterChevron" aria-hidden="true">▼</span>
        </button>

        <div class="filter-content" id="filterContent">
          <div class="filter-section">
            <h2>Categories</h2>
            <div class="filter-grid" id="categoryContainer"></div>
          </div>

          <div class="filter-section">
            <h2>Exclude Armor Tiers</h2>
            <div class="filter-tier-grid" id="armorTierContainer"></div>
          </div>

          <div class="filter-section">
            <h2>Exclude Helmet Tiers</h2>
            <div class="filter-tier-grid" id="helmetTierContainer"></div>
          </div>

          <div class="filter-section">
            <h2>Exclude Maps</h2>
            <div class="filter-grid" id="mapContainer"></div>
          </div>
        </div>
      </section>

      <section class="slot-machine" aria-label="Randomizer slots">
        <div class="payline"></div>
        <div class="payline payline-secondary" hidden></div>

        <div class="col-container" data-category="map">
          <span class="label">Map</span>
          <div class="window">
            <div class="strip" id="strip-map"></div>
          </div>
        </div>

        <div class="col-container" data-category="helmet">
          <span class="label">Helmet</span>
          <div class="window">
            <div class="strip" id="strip-helmet"></div>
          </div>
        </div>

        <div class="col-container" data-category="armor">
          <span class="label">Armor</span>
          <div class="window">
            <div class="strip" id="strip-armor"></div>
          </div>
        </div>

        <div class="col-container" data-category="weapon">
          <span class="label">Weapon</span>
          <div class="window">
            <div class="strip" id="strip-weapon"></div>
          </div>
        </div>

        <div class="col-container" data-category="chestRig">
          <span class="label">Chest Rig</span>
          <div class="window">
            <div class="strip" id="strip-chest-rig"></div>
          </div>
        </div>

        <div class="col-container" data-category="armoredChestRig">
          <span class="label">Armored Chest Rig</span>
          <div class="window">
            <div class="strip" id="strip-armored-chest-rig"></div>
          </div>
        </div>

        <div class="col-container" data-category="headset">
          <span class="label">Headset</span>
          <div class="window">
            <div class="strip" id="strip-headset"></div>
          </div>
        </div>

        <div class="col-container" data-category="secondary">
          <span class="label">Secondary</span>
          <div class="window">
            <div class="strip" id="strip-secondary"></div>
          </div>
        </div>

        <div class="col-container" data-category="backpack">
          <span class="label">Backpack</span>
          <div class="window">
            <div class="strip" id="strip-backpack"></div>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="Randomizer controls">
        <button class="spin-btn" id="spinBtn" type="button">Start</button>

        <label class="setting-box" for="chanceInput">
          <span class="setting-label">ZTH Chance %</span>
          <input type="number" id="chanceInput" value="5" min="0" max="100" />
        </label>
      </section>
    </main>

    <footer class="page-footer">
      <p>Static build for GitHub Pages.</p>
    </footer>

    <script type="module" src="./assets/js/app.js"></script>
  </body>
</html>
