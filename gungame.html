<html lang="de">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06080d" />

    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #06080d;
        color: #f2f5f9;
        font-family: system-ui, sans-serif;
      }
      a {
        color: #33d6ff;
      }
    </style>

  <body>
    <p>
      GunGame ist jetzt v2.
      <a href="./v2/index.html#/gungame">Weiter zu GunGame</a>
    </p>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then((regs) => regs.forEach((reg) => reg.unregister()))
          .catch(() => {});
      }
      location.replace("./v2/index.html#/gungame");
    </script>
  </body>
