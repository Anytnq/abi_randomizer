<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - OPERATION: RNG</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #0c1016 0%, #121924 100%);
        color: #f3f6fa;
        font-family: "Rajdhani", sans-serif;
      }

      .offline-card {
        width: min(520px, 92vw);
        padding: 24px;
        border: 1px solid #ffffff2d;
        border-radius: 14px;
        background: #ffffff10;
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-family: "Teko", sans-serif;
        letter-spacing: 1px;
        font-size: 42px;
        color: #f1c35a;
      }

      p {
        margin: 0;
        color: #d2dae3;
      }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <h1>Offline</h1>
      <p>
        Keine Verbindung. Die Seite wird automatisch aktualisiert, sobald du
        wieder online bist.
      </p>
    </div>
  </body>
</html>
